name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.5
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Check project metadata and lockfile
        run: uv check --preview-features check-command

      - name: Audit dependencies
        run: uv audit

      - name: Compile Python sources
        run: uv run python -m compileall -q cli_demo.py server.py src

      - name: Build package
        run: uv build